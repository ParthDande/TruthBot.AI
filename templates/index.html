<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthBot.AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap');

        :root {
            --primary-color: #789176;
            --secondary-color:  #4A5D4B;
            --background-color: #F5F5F1;
            --text-color:  #C06B4D;
            --card-bg: rgba(255, 255, 255, 0.95);
            --team-bg: rgba(248, 249, 250, 0.9);
            --positive-color: #4CAF50;
            --negative-color: #ff4d4d;
            --neutral-color: #FF5733;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --hover-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            --primary-color: #F5F5F1;
            --secondary-color: #C06B4D;
            --background-color: #0b0b0a;
            --text-color: #789176;
            --card-bg: rgba(40, 40, 40, 0.95);
            --team-bg: rgba(26, 26, 26, 0.9);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --hover-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Cormorant Garamond', serif;
            background: var(--background-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--background-color);
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            color: var(--text-color);
            font-weight: bold;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
            margin-top: 60px;
            height: calc(100vh - 60px);
        }

        .text-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25vh;
            margin-bottom: 2rem;
        }

        .static-text {
            font-size: 4vw;
            color: var(--text-color);
            white-space: nowrap;
            line-height: 1;
        }

        .dynamic-text-wrapper {
            position: relative;
            min-width: 250px;
            height: 4vw;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .dynamic-text {
            position: absolute;
            left: 0;
            font-size: 4vw;
            color: var(--secondary-color);
            white-space: nowrap;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            line-height: 1;
        }

        .dynamic-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        .dynamic-text.fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }

        .search-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            margin-top: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-color);
            outline: none;
        }

        .button-group {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 1.5rem;
}

.action-button {
    padding: 0.8rem 1.5rem;
    border: 2px solid var(--primary-color);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text-color);
    cursor: pointer;
    font-size: 1rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 160px;
    justify-content: center;
    backdrop-filter: blur(8px);
    box-shadow: var(--card-shadow);
}

.action-button:hover {
    background: var(--primary-color);
    color: var(--background-color);
    transform: translateY(-2px);
    box-shadow: var(--hover-shadow);
}
.action-button i {
    font-size: 1.1rem;
}
.action-button:hover i {
    transform: scale(1.1);
    transition: transform 0.2s ease;
}
.action-button:focus {
    outline: none;
    box-shadow: 0 0 0 3px var(--background-color),
                0 0 0 6px var(--primary-color);
}

        @media (max-width: 600px) {
            .static-text, .dynamic-text {
                font-size: 4vw;
            }
            
            .dynamic-text-wrapper {
                min-width: 200px;
                height: 4vw;
            }
            
            .search-container {
                width: 90%;
            }
            
            .button-group {
        flex-direction: column;
        width: 90%;
    }
            
    .action-button {
        width: 100%;
        min-width: unset;
    }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo" style="text-decoration: none;">TruthBot.ai</a>
        <button id="theme-toggle" class="theme-toggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <main class="main-content">
        <div class="text-container">
            <div class="static-text">Making sense of news through </div>
            <div class="dynamic-text-wrapper">
                <div class="dynamic-text">analysis</div>
                <div class="dynamic-text">summaries</div>
                <div class="dynamic-text">validations</div>
            </div>
        </div>

        <div class="search-container">
            <input type="url" class="search-input" placeholder="Enter URL to analyze..." id="url-input">
            <div class="button-group">
            <button class="action-button" onclick="handleAction('report')">
                <i class="fas fa-search"></i> Analyze
            </button>
            <button class="action-button" onclick="handleAction('summarization')">
                <i class="fas fa-file-alt"></i> Summarize
            </button>
            <button class="action-button" onclick="handleAction('plagiarism')">
                <i class="fas fa-check-circle"></i> Check Plagiarism
            </button>
            </div>
        </div>
    </main>

    <script>
        const words = document.querySelectorAll('.dynamic-text');
        let currentIndex = 0;

        function showNextWord() {
            words.forEach((word, index) => {
                if (index === currentIndex) {
                    word.classList.remove('active');
                    word.classList.add('fade-out');
                } else {
                    word.classList.remove('active', 'fade-out');
                }
            });

            currentIndex = (currentIndex + 1) % words.length;

            setTimeout(() => {
                words.forEach((word, index) => {
                    word.classList.remove('fade-out');
                    if (index === currentIndex) {
                        word.classList.add('active');
                    }
                });
            }, 500);
        }

        words[0].classList.add('active');
        setInterval(showNextWord, 3000);

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('i');
        
        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function handleAction(action) {
            const url = document.getElementById('url-input').value;
            if (!url) {
                alert('Please enter a URL');
                return;
            }
            window.location.href = `/${action}?url=${encodeURIComponent(url)}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateThemeIcon('light');
        });
    </script>
</body>
</html>
