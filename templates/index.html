<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #FF6B6B;
            margin-bottom: 2rem;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            border: 2px solid #4ECDC4;
            font-family: 'Poppins', sans-serif;
            resize: vertical;
        }
        button {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            color: white;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: 600;
            font-size: 1rem;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        .summary {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(78, 205, 196, 0.1);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: left;
        }
        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #FF6B6B;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <textarea id="text-input" placeholder="Enter your text here to experience the magic of summarization..."></textarea>
        <button onclick="summarizeText()" id="summarize-btn">Summarize Magic</button>
        <div id="loader" class="loader"></div>
        <div id="summary" class="summary" style="display: none;"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    <script>
        function summarizeText() {
            const text = document.getElementById('text-input').value;
            const loader = document.getElementById('loader');
            const summarizeBtn = document.getElementById('summarize-btn');
            const summaryDiv = document.getElementById('summary');

            // Show loader and disable button
            loader.style.display = 'block';
            summarizeBtn.disabled = true;
            summaryDiv.style.display = 'none';

            fetch('/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                // Hide loader and enable button
                loader.style.display = 'none';
                summarizeBtn.disabled = false;

                // Display summary in the same page
                summaryDiv.innerText = data.summary;
                summaryDiv.style.display = 'block';
                gsap.fromTo(summaryDiv, 
                    { opacity: 0, y: 20 }, 
                    { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }
                );
            })
            .catch(error => {
                console.error('Error:', error);
                // Hide loader and enable button in case of error
                loader.style.display = 'none';
                summarizeBtn.disabled = false;
                alert('An error occurred while summarizing the text. Please try again.');
            });
        }
    </script>
</body>
</html>
