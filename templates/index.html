<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthBot.AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
      <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAgSURBVHgB7cExAQAAAMKg9U9tCF8gAAAAAAAAAAAAAAAAAADAvAk1IAABi4x5JgAAAABJRU5ErkJggg==">
      <script src="/static/js/theme.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap');

        :root {
            --background-color: #f8fafc; /* Pale Lavender */
--primary-color: #5D3FD3;    /* Rich Indigo */
--secondary-color: #9F7AEA;  /* Soft Amethyst */
--accent-color: #E5DEF2;     /* Gentle Lavender Gray */
--text-color: #292627;       /* Deep Onyx */

        }

        [data-theme="dark"] {
            --primary-color: #F5F5F1;
            --secondary-color: #9F7AEA;
            --background-color: #0b0b0a;
            --text-color: #F4F1F8;
            --card-bg: rgba(40, 40, 40, 0.95);
            --team-bg: rgba(26, 26, 26, 0.9);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --hover-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Loading Animation Container */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(248, 250, 252, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }

        .loader {
            width: 100px;
            height: 80px;
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            bottom: 0;
            margin: auto;
        }
        .loader .image {
            width: 100px;
            height: 160px;
            font-size: 60px;
            text-align: center;
            transform-origin: bottom center;
            animation: 1.5s rotate infinite;
            opacity: 0;
            margin-top:-60px;
        }
        .loader span {
            display: block;
            width: 100%;
            text-align: center;
            position: absolute;
            bottom: 0;
            font-size: 3vh;
        }

        @keyframes rotate {
            0% {
                transform: rotate(90deg);
            }
            10% {
                opacity: 0;
            }
            35% {
                transform: rotate(0deg);
                opacity: 1;
            }
            65% {
                transform: rotate(0deg);
                opacity: 1;
            }
            80% {
                opacity: 0;
            }
            100% {
                transform: rotate(-90deg);
            }
        }

        #content {
            display: none; /* Hide content initially */
            padding: 20px;
            text-align: center;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Cormorant Garamond', serif;
            background: var(--background-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--background-color);
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            color: var(--text-color);
            font-weight: bold;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
            margin-top: 60px;
            height: calc(100vh - 60px);
        }

        .text-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25vh;
            margin-bottom: 2rem;
        }

        .static-text {
            font-size: 4vw;
            color: var(--text-color);
            white-space: nowrap;
            line-height: 1;
        }

        .dynamic-text-wrapper {
            position: relative;
            min-width: 250px;
            height: 4vw;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .dynamic-text {
            position: absolute;
            left: 0;
            font-size: 4vw;
            color: var(--secondary-color);
            white-space: nowrap;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            line-height: 1;
        }

        .dynamic-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        .dynamic-text.fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }

        .search-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            margin-top: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-color);
            outline: none;
        }

        .button-group {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 1.5rem;
    

}

.action-button {
    padding: 0.8rem 1.5rem;
    border: 2px solid var(--primary-color);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text-color);
    cursor: pointer;
    font-size: 1rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 200px;
    justify-content: center;
    backdrop-filter: blur(8px);
    box-shadow: var(--card-shadow);
}

.action-button:hover {
    background: var(--primary-color);
    color: var(--background-color);
    transform: translateY(-2px);
    box-shadow: var(--hover-shadow);
}
.action-button i {
    font-size: 1.1rem;
}
.action-button:hover i {
    transform: scale(1.1);
    transition: transform 0.2s ease;
}
.action-button:focus {
    outline: none;
    box-shadow: 0 0 0 3px var(--background-color),
                0 0 0 6px var(--primary-color);
}

        @media (max-width: 600px) {
            .main-content {
        padding: 1rem;
        height: calc(100vh - 50px);
    }

    .text-container {
        flex-direction: column;
        align-items: center;
        justify-content: center; /* Center dynamically */
        gap: 10px;
        margin-top: 80px; /* Reset to center fully */
        margin-bottom: 0;
    }

    .static-text {
        font-size: 8vw; 
    }

    .dynamic-text-wrapper {
        min-width: auto; /* Allow dynamic width */
        height: 6vw; /* Match font size */
        display: flex;
        align-items: center;
        justify-content: center; /* Center dynamic text */
    }

    .dynamic-text {
        font-size: 8vw;
    }

    .search-container {
        width: 100%;
        max-width: 100%; 
        margin-top: 1.5rem;
    }

    .search-input {
        font-size: 1rem;
        padding: 0.8rem;
        border-radius: 6px;
    }

    .button-group {
        flex-direction: column;
        gap: 0.8rem;
    }

    .action-button {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
        min-width: 120px;
        gap: 0.4rem;
    }

    .action-button i {
        font-size: 1rem; 
    }
           
        }

        .header-controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    margin-left: auto; /* Push controls to the right */
}

/* Dropdown styles */
.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-toggle {
    padding: 0.5rem 1rem !important;
    min-width: auto !important;
    font-size: 0.9rem !important;
    background: var(--card-bg);
    border: 2px solid var(--primary-color);
    border-radius: 8px;
    color: var(--text-color);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    backdrop-filter: blur(8px);
    box-shadow: var(--card-shadow);
    transition: all 0.3s ease;
}

.dropdown-toggle:hover {
    background: var(--primary-color);
    color: var(--background-color);
    transform: translateY(-2px);
    box-shadow: var(--hover-shadow);
}

.dropdown-content {
    display: none; /* Hidden by default */
    position: absolute;
    right: 0;
    background: var(--card-bg);
    min-width: 200px;
    border-radius: 8px;
    box-shadow: var(--card-shadow);
    backdrop-filter: blur(8px);
    z-index: 1000;
    padding: 0.5rem;
    margin-top: 0.5rem; /* Add space between button and dropdown */
}

.dropdown-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    color: var(--text-color);
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.2s ease;
}

.dropdown-item:hover {
    background: var(--primary-color);
    color: var(--background-color);
}

.dropdown-item i {
    width: 20px;
    text-align: center;
}

@media (max-width: 600px) {
    .dropdown-toggle {
        padding: 0.4rem 0.8rem !important;
        font-size: 0.8rem !important;
    }

    .dropdown-content {
        min-width: 180px;
    }
}
    </style>
</head>

<body>
    <div class="loader">
        <div class="image">
            <i class="fas fa-codepen"></i>
        </div>
        <span>0%</span>
    </div>

    <!-- New Processing Animation -->
    <div class="loading-container" id="loadingAnimation">
        <dotlottie-player
  src="https://lottie.host/2c1fe9e5-f828-473f-886e-0fe4355cdb6c/eHpQ8nn2Tz.lottie"
  background="transparent"
  speed="1"
  style="width: 300px; height: 300px"
  loop
  autoplay
></dotlottie-player>
        <div class="loading-text">Processing your request...</div>
    </div>

    <div id="content">
        <div class="header">
            <a href="/" class="logo" style="text-decoration: none;">TruthBot.ai</a>
            <div class="header-controls">
                <!-- Dropdown Menu -->
                <div class="dropdown">
                    <button class="dropdown-toggle action-button">
                        <i class="fas fa-tools"></i> Tools
                    </button>
                    <div class="dropdown-content">
                        <a href="/plagiarism" class="dropdown-item">
                            <i class="fas fa-check-circle"></i> Plagiarism Check
                        </a>
                        <a href="/summarization" class="dropdown-item">
                            <i class="fas fa-file-alt"></i> Summarization
                        </a>
                        <a href="/analyze" class="dropdown-item">
                            <i class="fas fa-exclamation-triangle"></i> Fake News Tool
                        </a>
                    </div>
                </div>
                <!-- Theme Toggle -->
                <button id="theme-toggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

    <main class="main-content">
        <div class="text-container">
            <div class="static-text">Making sense of news through </div>
            <div class="dynamic-text-wrapper">
                <div class="dynamic-text">analysis</div>
                <div class="dynamic-text">summaries</div>
                <div class="dynamic-text">validations</div>
            </div>
        </div>
        <div class="search-container">
            <form id="analysis-form" method="POST">
                <input type="url" class="search-input" placeholder="Enter URL to analyze..." id="url-input" name="text" required>
                <div class="button-group">
                    <button type="submit" class="action-button" data-action="report">
                        <i class="fas fa-search"></i> Analyze
                    </button>
                    <!--<button type="submit" class="action-button" data-action="summarization">
                        <i class="fas fa-file-alt"></i> Summarize
                    </button>
                    <button type="submit" class="action-button" data-action="plagiarism">
                        <i class="fas fa-check-circle"></i> Check Plagiarism
                    </button>-->
                </div>
            </form>
        </div>
    </main>
</div>

<script>
     $(document).ready(function () {
    let counter = 0;
    const imageInterval = setInterval(function () {
        changeImage(counter);
        counter++;
        if (counter >= 2) counter = 0;
    }, 1000);
    loading(imageInterval);
});

function changeImage(counter) {
    const images = [
        '<i class="fas fa-search"></i>',
        '<i class="fas fa-file-alt"></i>',
        '<i class="fas fa-chart-bar"></i>',
        '<i class="fas fa-check-circle"></i>',
        '<i class="fas fa-clipboard"></i>',
        '<i class="fas fa-bullhorn"></i>',
    ];
    $(".loader .image").html(images[counter]);
}

function loading(imageInterval) {
    let num = 0;
    const interval = setInterval(function () {
        $('.loader span').html(`Loading... ${num}%`);
        num++;
        if (num > 100) {
            clearInterval(interval);
            clearInterval(imageInterval);
            $(".loader").fadeOut(function () {
                $("#content").fadeIn();
            });
        }
    }, 10);
}

// Dynamic text animation
const words = document.querySelectorAll('.dynamic-text');
let currentIndex = 0;

function showNextWord() {
    words.forEach((word, index) => {
        if (index === currentIndex) {
            word.classList.remove('active');
            word.classList.add('fade-out');
        } else {
            word.classList.remove('active', 'fade-out');
        }
    });

    currentIndex = (currentIndex + 1) % words.length;

    setTimeout(() => {
        words.forEach((word, index) => {
            word.classList.remove('fade-out');
            if (index === currentIndex) {
                word.classList.add('active');
            }
        });
    }, 500);
}

words[0].classList.add('active');
setInterval(showNextWord, 3000);

// Theme toggle
const themeToggle = document.getElementById('theme-toggle');
const themeIcon = themeToggle.querySelector('i');

function updateThemeIcon(theme) {
    themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

themeToggle.addEventListener('click', () => {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateThemeIcon(newTheme);
});

// URL validation
function isValidUrl(string) {
    try {
        new URL(string);
        return true;
    } catch (_) {
        return false;
    }
}

// Form submission with loading animation
document.getElementById('analysis-form').addEventListener('submit', function (e) {
    e.preventDefault();

    const urlInput = document.getElementById('url-input');
    const url = urlInput.value.trim();
    const action = e.submitter.getAttribute('data-action');

    if (!isValidUrl(url)) {
        urlInput.classList.add('invalid');
        alert('Please enter a valid URL');
        return;
    }

    urlInput.classList.remove('invalid');

    // Show loading animation
    document.getElementById('loadingAnimation').style.display = 'flex';

    // Create form data
    const formData = new FormData();
    formData.append('text', url);

    // Submit the form
    fetch(`/${action}`, {
        method: 'POST',
        body: formData
    })
        .then(response => {
            if (response.redirected) {
                window.location.href = response.url;
            } else {
                return response.text().then(html => {
                    document.documentElement.innerHTML = html;
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while processing your request');
            // Hide loading animation on error
            document.getElementById('loadingAnimation').style.display = 'none';
        });
});

// Dropdown functionality
// Dropdown functionality
document.addEventListener('DOMContentLoaded', () => {
    const dropdownToggle = document.querySelector('.dropdown-toggle');
    const dropdownContent = document.querySelector('.dropdown-content');

    // Toggle dropdown visibility on button click
    dropdownToggle.addEventListener('click', function (e) {
        e.preventDefault(); // Prevent default button behavior
        e.stopPropagation(); // Prevent event bubbling
        dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function (e) {
        if (!dropdownToggle.contains(e.target) && !dropdownContent.contains(e.target)) {
            dropdownContent.style.display = 'none';
        }
    });

    // Add dropdown item interaction
    document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', function (e) {
            document.getElementById('loadingAnimation').style.display = 'flex';
        });
    });
});
    </script>
</body>
</html>
