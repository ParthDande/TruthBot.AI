<html>
<head>
    <title>TruthBot.AI</title>
    <script src="https://unpkg.com/react/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://placehold.co/16x16" type="image/png">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        .fade-in {
            animation: fadeIn 2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const App = () => {
            const [showScrollUp, setShowScrollUp] = React.useState(false);

            const scrollToSection = (id) => {
                document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
            };

            const handleScroll = () => {
                if (window.scrollY > 300) {
                    setShowScrollUp(true);
                } else {
                    setShowScrollUp(false);
                }
            };

            React.useEffect(() => {
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div>
                    <header className="bg-white shadow-md fixed w-full top-0 z-50 fade-in">
                        <div className="container mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center">
                                <img src="https://placehold.co/30x30" alt="TruthBot.AI Logo" className="mr-2"/>
                                <span className="text-xl font-bold">TruthBot.AI</span>
                            </div>
                            <nav className="flex items-center space-x-4">
                                <a href="#" className="text-blue-600" onClick={() => scrollToSection('home')}>Home</a>
                                <a href="#" className="text-gray-600" onClick={() => scrollToSection('services')}>Services</a>
                                <a href="#" className="text-gray-600" onClick={() => scrollToSection('contact')}>Contact</a>
                                <button className="bg-blue-600 text-white px-4 py-2 rounded">Sign Up</button>
                                <i className="fas fa-search text-gray-600"></i>
                            </nav>
                        </div>
                    </header>

                    <main className="container mx-auto px-4 py-16 mt-20">
                        <section id="home" className="text-center fade-in">
                            <h1 className="text-4xl font-bold mb-8">Welcome to TruthBot.AI</h1>
                            <div className="flex justify-center mb-8">
                                <img src="https://placehold.co/600x400" alt="AI analysis screenshots" className="rounded shadow-md"/>
                            </div>
                            <p className="text-gray-700 mb-4">
                                TruthBot.AI leverages AI and machine learning to analyze non-verified news, providing users with comprehensive insights and enhancing media literacy. Our mission is to empower users with the tools needed to discern factual information in today's digital world.
                            </p>
                            <div className="flex justify-center space-x-4 mb-8">
                                <button className="bg-blue-600 text-white px-4 py-2 rounded">Learn More</button>
                                <button className="bg-blue-600 text-white px-4 py-2 rounded">Login</button>
                            </div>
                            <p className="text-gray-700">
                                Contact us at: contact@TruthBot.ai<br/>
                                Meet the Team: Our dedicated team of AI experts and journalists.
                            </p>
                        </section>

                        <section id="services" className="flex justify-around text-center py-16 fade-in">
                            <div>
                                <h2 className="text-xl font-bold mb-4">Monitoring</h2>
                                <p className="text-gray-700">Track and assess non-verified news in real-time.</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-bold mb-4">Evaluation & Analysis</h2>
                                <p className="text-gray-700">AI-driven analysis for news credibility assessment.</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-bold mb-4">Reporting & Engagement</h2>
                                <p className="text-gray-700">Generate reports and foster user engagement.</p>
                            </div>
                        </section>

                        <section className="text-center py-16 fade-in">
                            <h2 className="text-3xl font-bold text-blue-600 mb-4">Discover the Future</h2>
                            <p className="text-gray-700 mb-8">
                                Join TruthBot.AI to stay ahead with real-time updates and curated news from trusted sources. Enjoy a personalized news experience tailored just for you.
                            </p>
                            <button className="bg-blue-600 text-white px-4 py-2 rounded">Get Started</button>
                        </section>

                        <section className="text-center py-16 bg-gray-100 fade-in">
                            <h2 className="text-3xl font-bold mb-4">About us</h2>
                            <p className="text-gray-700 mb-8">
                                Meet our dynamic team of experts dedicated to delivering cutting-edge AI-driven news solutions.
                            </p>
                            <div className="flex justify-center">
                                <img src="https://placehold.co/800x400" alt="Team working in an office" className="rounded shadow-md"/>
                            </div>
                        </section>

                        <section id="contact" className="py-16 fade-in">
                            <div className="container mx-auto px-4 flex justify-between">
                                <div className="w-1/2 pr-8">
                                    <h2 className="text-3xl font-bold mb-4">Contact Us</h2>
                                    <form>
                                        <div className="mb-4">
                                            <label className="block text-gray-700 mb-2">Name</label>
                                            <input type="text" className="w-full px-4 py-2 border rounded" placeholder="Enter your name"/>
                                        </div>
                                        <div className="mb-4">
                                            <label className="block text-gray-700 mb-2">Email</label>
                                            <input type="email" className="w-full px-4 py-2 border rounded" placeholder="your@email.com"/>
                                        </div>
                                        <div className="mb-4">
                                            <label className="block text-gray-700 mb-2">Question or Feedback</label>
                                            <textarea className="w-full px-4 py-2 border rounded" placeholder="Enter question or feedback"></textarea>
                                        </div>
                                        <button className="bg-blue-600 text-white px-4 py-2 rounded">Submit</button>
                                    </form>
                                </div>
                                <div className="w-1/2 pl-8">
                                    <img src="https://placehold.co/400x400" alt="Map showing location" className="rounded shadow-md"/>
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="bg-gray-100 py-8 fade-in">
                        <div className="container mx-auto px-4 text-center">
                            <div className="flex justify-center items-center mb-4">
                                <img src="https://placehold.co/30x30" alt="TruthBot.AI Logo" className="mr-2"/>
                                <span className="text-xl font-bold">TruthBot.AI</span>
                            </div>
                            <div className="flex justify-center space-x-8 mb-8">
                                <div>
                                    <h3 className="font-bold mb-2">Product</h3>
                                    <ul>
                                        <li><a href="#" className="text-gray-700">Features</a></li>
                                        <li><a href="#" className="text-gray-700">Pricing</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h3 className="font-bold mb-2">Resources</h3>
                                    <ul>
                                        <li><a href="#" className="text-gray-700">Blog</a></li>
                                        <li><a href="#" className="text-gray-700">User guides</a></li>
                                        <li><a href="#" className="text-gray-700">Webinars</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h3 className="font-bold mb-2">Company</h3>
                                    <ul>
                                        <li><a href="#" className="text-gray-700">About us</a></li>
                                        <li><a href="#" className="text-gray-700">Contact us</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h3 className="font-bold mb-2">Plans & Pricing</h3>
                                    <ul>
                                        <li><a href="#" className="text-gray-700">Personal</a></li>
                                        <li><a href="#" className="text-gray-700">Start up</a></li>
                                        <li><a href="#" className="text-gray-700">Organization</a></li>
                                    </ul>
                                </div>
                            </div>
                            <p className="text-gray-700 mb-4">&copy; 2024 Brand, Inc. &middot; <a href="#" className="text-gray-700">Privacy</a> &middot; <a href="#" className="text-gray-700">Terms</a> &middot; <a href="#" className="text-gray-700">Sitemap</a></p>
                            <div className="flex justify-center space-x-4">
                                <a href="#" className="text-gray-700"><i className="fab fa-twitter"></i></a>
                                <a href="#" className="text-gray-700"><i className="fab fa-facebook"></i></a>
                                <a href="#" className="text-gray-700"><i className="fab fa-linkedin"></i></a>
                                <a href="#" className="text-gray-700"><i className="fab fa-youtube"></i></a>
                            </div>
                        </div>
                    </footer>

                    <button 
                        className={`scroll-up ${showScrollUp ? '' : 'hidden'}`} 
                        onClick={() => scrollToSection('home')}
                    >
                        <i className="fas fa-arrow-up"></i>
                    </button>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
