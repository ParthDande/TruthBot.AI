<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Truthbot.AI</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #9F7AEA;
            --text-color: #2c3e50;
            --background-color: #f8f9fa;
            --error-color: #e74c3c;
            --border-color: #e1e8ed;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--primary-color);
            text-align: center;
        }

        .messages {
            padding: 12px;
            margin-bottom: 24px;
            border-radius: 8px;
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--error-color);
            font-size: 14px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-color);
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 32px;
        }

        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="static\images\truth-bot-high-resolution-logo-transparent - black.png" alt="Truthbot.AI Logo" width="50" height="50" style="border-radius: 20px;">
        </div>
        <h1>Sign in to Truthbot.AI</h1>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="messages" style = "color:green; background-color: white; ">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div>
                <label for="user_id">User ID:</label>
                <input type="text" id="user_id" name="user_id" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
            </div>
            <button type="submit">Login</button>
        </form>

        <div class="footer">
            <p>Don't have an account? <a href="{{ url_for('signup') }}">Create one</a></p>
        </div>
    </div>
</body>
</html>
